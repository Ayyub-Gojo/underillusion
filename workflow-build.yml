name: Construire les applis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: APK et AAB Android
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap add android
      - name: Icônes
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/icons.py
      - name: Publicités (AdMob)
        run: python3 scripts/ads.py
      - run: npx cap sync android
      - name: Numéro de version (augmente à chaque compilation)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Compiler l’APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../underillusion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: underillusion-android
          path: underillusion.apk
      - name: AAB signé pour le Play Store
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/bundle/release/app-release.aab ../underillusion-playstore.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: underillusion-playstore-aab
          path: underillusion-playstore.aab

  ios:
    name: IPA iOS (non signée)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap add ios
      - name: Icônes
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          python3 scripts/icons.py
      - name: Publicités (AdMob)
        run: python3 scripts/ads.py
      - run: npx cap sync ios
      - name: Compiler l’IPA
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr underillusion.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: underillusion-ios
          path: underillusion.ipa
