<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0C1D">
<title>UnderIllusion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UnderIllusion">
<style>
@font-face{font-family:"Dela Gothic One";src:url(fonts/dela-gothic-one-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Zen Kaku Gothic New";src:url(fonts/zen-kaku-gothic-new-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Zen Kaku Gothic New";src:url(fonts/zen-kaku-gothic-new-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Zen Kaku Gothic New";src:url(fonts/zen-kaku-gothic-new-latin-900-normal.woff2) format("woff2");font-weight:900;font-display:swap}
</style>
<style>
:root{
  --bg:#0F0C1D; --bg2:#171230; --surface:#221B3D; --surface2:#2C2450; --line:#3D3366;
  --ink:#F4F1FF; --muted:#A39CC7; --accent:#FF3D7F; --accent-ink:#FFFFFF;
  --cyan:#3DE0FF; --pop:#FFD15C; --ok:#3CCB97; --dot:rgba(255,255,255,.07);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EDEBF7; --bg2:#E1DCF3; --surface:#FFFFFF; --surface2:#F3F0FC; --line:#CDC5EA;
    --ink:#1A1533; --muted:#5F5784; --accent:#E5246A; --accent-ink:#FFFFFF;
    --cyan:#0790B5; --pop:#C98A00; --ok:#11885F; --dot:rgba(26,21,51,.08);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDEBF7; --bg2:#E1DCF3; --surface:#FFFFFF; --surface2:#F3F0FC; --line:#CDC5EA;
  --ink:#1A1533; --muted:#5F5784; --accent:#E5246A; --accent-ink:#FFFFFF;
  --cyan:#0790B5; --pop:#C98A00; --ok:#11885F; --dot:rgba(26,21,51,.08);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F0C1D; --bg2:#171230; --surface:#221B3D; --surface2:#2C2450; --line:#3D3366;
  --ink:#F4F1FF; --muted:#A39CC7; --accent:#FF3D7F; --accent-ink:#FFFFFF;
  --cyan:#3DE0FF; --pop:#FFD15C; --ok:#3CCB97; --dot:rgba(255,255,255,.07);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:12px 12px;
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.disp{font-family:"Dela Gothic One","Arial Black",Impact,sans-serif;font-weight:400}
h2{font-family:"Dela Gothic One","Arial Black",sans-serif;font-weight:400;font-size:1.25rem;margin:0;line-height:1.15}
p{margin:0 0 10px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--cyan);outline-offset:2px}
.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cut-s{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}

/* HUD du haut */
.hud{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:9;
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.hud .t{font-family:"Dela Gothic One",sans-serif;font-size:1.05rem;line-height:1;margin-right:auto;white-space:nowrap}
.hud .t span{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:900;font-size:.85rem;white-space:nowrap}
.pill.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:1rem}

.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(110px + var(--ad-h,0px) + env(safe-area-inset-bottom,0px))}
.wrap.ingame{padding-bottom:40px}

/* Barre d’onglets */
.tabbar{
  position:fixed;left:0;right:0;bottom:var(--ad-h,0px);z-index:9;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;
}
.tabbar[hidden]{display:none}
.tabbar .in{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:560px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;font-weight:900;font-size:.78rem;color:var(--muted)}
.tab .i{font-size:1.35rem;line-height:1;filter:grayscale(1);opacity:.7}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface)}
.tab[aria-current="page"] .i{filter:none;opacity:1}

/* Bannière */
.banner{
  position:relative;overflow:hidden;padding:22px 18px 18px;margin-bottom:22px;
  background:linear-gradient(120deg,var(--accent),#7B3DFF 70%,var(--cyan));color:#fff;
}
.banner::before{
  content:"";position:absolute;inset:-60%;
  background:repeating-conic-gradient(from 0deg at 85% 30%,rgba(255,255,255,.16) 0deg 3deg,transparent 3deg 11deg);
}
.banner>*{position:relative}
.banner h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(2.3rem,11vw,3.2rem);line-height:.92;margin:0;text-shadow:3px 3px 0 rgba(0,0,0,.25)}
.banner p{margin:10px 0 0;font-weight:700;opacity:.95}
.banner .stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.banner .pill{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.3);color:#fff}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.hint{color:var(--muted);font-size:.88rem}
.warn{color:var(--accent);font-weight:900;font-size:.92rem;margin-top:10px}

/* Avatars */
.ava{
  --c:var(--accent);flex:none;display:grid;place-items:center;width:44px;height:44px;font-size:1.4rem;
  background:color-mix(in srgb,var(--c) 30%,var(--surface2));
  border:2px solid var(--c);border-radius:14px;
}
.ava.lg{width:96px;height:96px;font-size:3rem;border-radius:26px;border-width:3px}

/* Sélection des joueurs */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:var(--surface);border:2px solid transparent;font-weight:900;font-size:.85rem;position:relative;min-width:0}
.ptile .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.ptile[aria-pressed="false"]{opacity:.5}
.ptile[aria-pressed="false"] .ava{filter:grayscale(.8)}
.ptile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.ptile[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--accent);font-weight:900}
.ptile.add{border:2px dashed var(--line);opacity:1;color:var(--muted)}
.ptile.add .ava{background:transparent;border-style:dashed;border-color:var(--line)}

/* Steppers rôles */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbox{background:var(--surface);padding:12px;border-radius:16px}
.rbox .lbl{font-weight:900;display:flex;align-items:center;gap:6px}
.rbox .ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.rbox .v{font-family:"Dela Gothic One",sans-serif;font-size:1.6rem;line-height:1}
.sbtn{width:38px;height:38px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:900;font-size:1.2rem}
.sbtn[disabled]{opacity:.35}

/* Boutons */
.cta{
  display:block;width:100%;margin-top:22px;padding:16px;
  font-family:"Dela Gothic One",sans-serif;font-size:1.2rem;letter-spacing:.02em;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#000);border-radius:16px;
  transition:transform .08s,box-shadow .08s;
}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.cta.alt{background:var(--surface);color:var(--ink);box-shadow:0 6px 0 var(--line)}
.cta+.cta{margin-top:14px}
.ghost{display:block;width:100%;margin-top:14px;padding:12px;border-radius:14px;border:1px solid var(--line);font-weight:900;color:var(--muted)}

/* Réglages */
.group{background:var(--surface);border-radius:18px;overflow:hidden}
.set{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.set:last-child{border-bottom:0}
.set .tx{flex:1;min-width:0}
.set .tx b{display:block}
.set .tx small{color:var(--muted);display:block;line-height:1.3}
.sw{flex:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
[aria-checked="true"] .sw{background:var(--ok)}
[aria-checked="true"] .sw::after{transform:translateX(20px)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.seg button{padding:9px 6px;border-radius:10px;font-weight:900;font-size:.9rem;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.set.col{flex-direction:column;align-items:stretch}

.gtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtab{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:900;font-size:.9rem;white-space:nowrap}
.gtab .c{font-size:.75rem;color:var(--muted);font-weight:700}
.gtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gtab[aria-selected="true"] .c{color:inherit;opacity:.7}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface);border-radius:16px 16px 0 0;border-bottom:1px solid var(--line)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;background:var(--surface);padding:12px;border-radius:0 0 16px 16px}
.tog{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface2);border:2px solid transparent;cursor:pointer;font-weight:900;line-height:1.2;position:relative}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .em{font-size:1.5rem;filter:grayscale(1);opacity:.45}
.tog small{display:block;font-weight:400;font-size:.76rem;color:var(--muted)}
.tog.on{border-color:var(--cyan)}
.tog.on .em{filter:none;opacity:1}

/* Profils */
.plist{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);padding:12px;border-radius:18px}
.prow .tx{flex:1;min-width:0}
.prow .nm{font-weight:900;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.prow .st span{font-size:.76rem;font-weight:700;background:var(--surface2);padding:2px 8px;border-radius:999px;color:var(--muted)}
.prow .st b{color:var(--ink)}
.rank{font-family:"Dela Gothic One",sans-serif;color:var(--muted);width:22px;text-align:center}
.prow.top .rank{color:var(--pop)}
.empty{text-align:center;padding:30px 16px;background:var(--surface);border-radius:18px}

/* Modale */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,3,14,.65);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;background:var(--bg2);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .22s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.field{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);padding:12px 14px;border-radius:14px}
.field:focus{border-color:var(--cyan);outline:none}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.egrid button{aspect-ratio:1;border-radius:12px;background:var(--surface);font-size:1.4rem;border:2px solid transparent}
.egrid button[aria-checked="true"]{border-color:var(--cyan);background:var(--surface2)}
.cgrid{display:flex;gap:10px;flex-wrap:wrap}
.cgrid button{width:38px;height:38px;border-radius:50%;background:var(--c);border:3px solid transparent}
.cgrid button[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg2) inset}
.lbl2{font-weight:900;margin:16px 0 8px;display:block}
.row2{display:flex;gap:10px;margin-top:18px}
.row2>*{flex:1;margin:0!important}

.linkbtn{color:var(--accent);font-weight:900;padding:4px 0}
.backlink{font-weight:900;color:var(--muted);padding:4px 0;margin-bottom:4px}
.mode-card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.mode-card .ic{font-size:2.2rem;line-height:1}
.mode-card h3{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:1.35rem;margin:10px 0 4px}
.mode-card.online{background:linear-gradient(135deg,color-mix(in srgb,var(--cyan) 28%,var(--surface)) 0%,var(--surface) 70%)}
.mode-card .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn-s{padding:13px 10px;border-radius:14px;font-weight:900;background:var(--accent);color:var(--accent-ink)}
.btn-s.alt{background:var(--ink);color:var(--bg)}
.codebox{text-align:center;padding:18px;background:var(--ink);color:var(--bg)}
.codebox .lab{font-weight:900;font-size:.85rem;opacity:.7}
.codebox .code{font-family:"Dela Gothic One",sans-serif;font-size:clamp(2.4rem,13vw,3.2rem);letter-spacing:.18em;line-height:1.1;margin:6px 0 8px;padding-left:.18em}
.codebox .copy{font-weight:900;font-size:.85rem;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--bg) 18%,transparent)}
.code-in{font-family:"Dela Gothic One",sans-serif;font-size:2rem;letter-spacing:.35em;text-align:center;text-transform:uppercase;padding-left:calc(14px + .35em)}
.phone{background:var(--surface);border-radius:16px;padding:10px 12px;margin-bottom:8px;border:2px solid transparent}
.phone.me{border-color:var(--cyan)}
.phone .h{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.phone .avs{display:flex;flex-wrap:wrap;gap:8px 14px}
.phone .m{display:flex;align-items:center;gap:6px;font-weight:900;font-size:.92rem}
.phone .m .ava{width:30px;height:30px;font-size:1rem;border-radius:9px}
.waitbox{margin-top:18px;padding:14px;border-radius:16px;background:var(--surface);text-align:center;font-weight:900;color:var(--muted)}
.order button[disabled]{cursor:default;opacity:1}

/* Carte à retourner */
.stage{perspective:1200px;margin:10px 0 24px}
.flip{position:relative;height:380px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 18px;overflow:hidden}
.back{background:var(--surface);}
.back::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--accent) 12%,transparent) 14px 16px)}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,var(--surface2),var(--surface));}
.front::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--cyan) 18%,transparent) 0deg 2deg,transparent 2deg 10deg)}
.front.white::before{background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--pop) 22%,transparent) 0deg 2deg,transparent 2deg 10deg)}
.face>*{position:relative}
.emblem{font-size:4.2rem;line-height:1;margin-bottom:12px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.word{font-family:"Dela Gothic One",sans-serif;font-size:clamp(1.8rem,8.5vw,2.5rem);line-height:1.05;overflow-wrap:anywhere}
.from{display:inline-block;margin-top:12px;font-weight:900;font-size:.85rem;background:var(--bg);padding:4px 12px;border-radius:999px;color:var(--muted)}
.bigname{font-family:"Dela Gothic One",sans-serif;font-size:2rem;line-height:1.05;overflow-wrap:anywhere;margin-top:6px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--accent)}
.dots i.c{background:var(--ink);transform:scale(1.3)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.sheet,.scrim{animation:none}}

/* Partie */
.timer{display:flex;align-items:center;gap:14px;background:var(--surface);padding:14px;border-radius:18px;margin-bottom:16px}
.timer .clock{font-family:"Dela Gothic One",sans-serif;font-size:2.2rem;line-height:1;min-width:92px}
.timer.low .clock{color:var(--accent)}
.timer .bar{flex:1;height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--cyan);transition:width 1s linear}
.timer.low .bar i{background:var(--accent)}
.order{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.order button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);padding:10px 12px;border-radius:16px;font-weight:900}
.order button:active{background:var(--surface2)}
.order .n{font-family:"Dela Gothic One",sans-serif;color:var(--muted);width:20px;text-align:center}
.order .first .n{color:var(--accent)}
.order .tag{margin-left:auto;font-size:.75rem;background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:999px}
.order .vote{margin-left:auto;font-size:.8rem;color:var(--muted)}
.order .first .vote{margin-left:8px}
.out{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.out span{display:flex;align-items:center;gap:6px;background:var(--surface);padding:4px 10px 4px 4px;border-radius:999px;font-size:.85rem;font-weight:700;color:var(--muted)}
.out .ava{width:26px;height:26px;font-size:.9rem;border-radius:8px;filter:grayscale(1)}

.rolechip{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:900}
.rolechip.civil{background:var(--surface2);color:var(--ink)}
.rolechip.uc{background:var(--accent);color:var(--accent-ink)}
.rolechip.white{background:var(--pop);color:#1A1533}
.result{background:var(--surface);padding:26px 18px;text-align:center;border-radius:22px;margin:10px 0 14px;position:relative;overflow:hidden}
.result::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,var(--dot) 0deg 3deg,transparent 3deg 10deg)}
.result>*{position:relative}
.result .ava{margin:0 auto 10px}
.recap{display:grid;gap:8px;margin-top:10px}
.recap .r{display:flex;align-items:center;gap:10px;background:var(--surface);padding:8px 12px 8px 8px;border-radius:14px}
.recap .r .nm{font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recap .plus{color:var(--ok);font-weight:900}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.words div{background:var(--surface);border-radius:16px;padding:12px;text-align:center}
.words b{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:1.05rem;line-height:1.2;margin-top:4px;overflow-wrap:anywhere}
.words .e{font-size:1.8rem}

.rules{margin-top:22px;background:var(--surface);border-radius:16px;padding:4px 14px}
.rules summary{font-weight:900;cursor:pointer;padding:10px 0}
.rules ul{padding-left:18px;margin:0 0 12px;color:var(--muted)}
.rules li{margin-bottom:6px}

function pairsOf(a,mode){return mode==="hard"?a.h:mode==="expert"?a.x:a.n}
function interOn(){return S.set.mode==="normal"?S.set.interNormal:S.set.interHard}
function pool(){
  const on=new Set(S.set.animes), out=[], m=S.set.mode;
  ANIMES.forEach(a=>{if(!on.has(a.id))return;
    pairsOf(a,m).forEach((p,i)=>out.push({key:a.id+m+i,a:{n:p[0],a:a.id},b:{n:p[1],a:a.id}}));
  });
  if(interOn()) (m==="normal"?[["n",CROSS.n]]:m==="hard"?[["h",CROSS.h]]:[["h",CROSS.h],["x",CROSS.x]]).forEach(([tag,list])=>list.forEach((c,i)=>{
    if(AN[c[1]]&&AN[c[3]]&&on.has(c[1])&&on.has(c[3])) out.push({key:"x"+m+tag+i,a:{n:c[0],a:c[1]},b:{n:c[2],a:c[3]},cross:true});
  }));
  return out;
}
function pickPair(){
  const all=pool();
  let avail=all.filter(p=>!S.used.includes(p.key));
  if(!avail.length){S.used=[];avail=all}
  const p=avail[Math.floor(Math.random()*avail.length)];
  S.used.push(p.key);
  return Math.random()<.5?{civil:p.a,uc:p.b,cross:p.cross}:{civil:p.b,uc:p.a,cross:p.cross};
}

function phones(){
  const N=S.net; if(!N) return [];
  const list=[];
  const mine=S.profiles.filter(p=>N.sel.includes(p.id)).map(p=>({id:p.id,n:p.name,e:p.emoji,c:p.color}));
  if(N.isHost) list.push({peer:N.me,me:true,host:true,pl:mine});
  N.peers.forEach(pr=>{
    if(pr.sameTab||!pr.presence) return;
    const pres=pr.presence;
    if(N.isHost&&pres.h) return;
    if(!N.isHost&&pres.h&&pr.peer!==N.hostPeer) return;
    if(!pres.h&&!pres.g) return;
    list.push({peer:pr.peer,me:false,host:!!pres.h,pl:cleanPl(pres.pl),ready:pres.ready});
  });
  if(!N.isHost) list.splice(list.findIndex(x=>x.host)+1,0,{peer:N.me,me:true,host:false,pl:mine});
  list.sort((a,b)=>(b.host?1:0)-(a.host?1:0));
  return list;
}
function rosterOnline(){
  const out=[];
  phones().forEach(ph=>ph.pl.forEach(q=>out.push({id:q.id,n:q.n,e:q.e,c:q.c,peer:ph.peer})));
  return out.slice(0,16);
}

}

/* ---------- Rooms hors claude.ai : connexion directe entre téléphones (PeerJS) ---------- */
// L’hôte est le centre : chaque invité se connecte à lui, il renvoie à tous la liste des présences.
const P2P={
  join(name,isHost){return new Promise((res,rej)=>{
    const hostId="underillusion-"+name;
    let peer;
    try{peer=isHost?new Peer(hostId,{debug:0}):new Peer(undefined,{debug:0})}catch(e){rej({code:"network"});return}
    let selfId=null,mine={},hostConn=null,hostList=[],connected=false,closed=false,settled=false,fireT=null,bT=null;
    const others=new Map(), ph=[], ch=[];
    const entry=(peerId,pres,me)=>({peer:peerId,by:null,isMe:me,sameTab:me,kind:"viewer",guest:false,presence:pres||{},updatedAt:Date.now()});
    const snapshot=()=>{
      const arr=[entry(selfId||"me",mine,true)];
      if(isHost) others.forEach((v,k)=>{if(v.pres)arr.push(entry(k,v.pres,false))});
      else hostList.forEach(e=>{if(e&&typeof e.peer==="string"&&e.peer!==selfId)arr.push(entry(e.peer,e.presence&&typeof e.presence==="object"?e.presence:{},false))});
      return arr;
    };
    const fire=()=>{if(fireT)return;fireT=setTimeout(()=>{fireT=null;const p=snapshot();ph.slice().forEach(h=>{try{h({peers:p,joined:[],left:[],updated:[]})}catch(e){console.error(e)}})},0)};
    const setConn=c=>{if(connected!==c){connected=c;ch.slice().forEach(h=>{try{h(c)}catch(e){}})}};
    const broadcast=()=>{if(bT)return;bT=setTimeout(()=>{bT=null;
      const list=[{peer:selfId,presence:mine}];others.forEach((v,k)=>{if(v.pres)list.push({peer:k,presence:v.pres})});
      others.forEach(v=>{try{if(v.conn&&v.conn.open)v.conn.send({t:"peers",list})}catch(e){}});
    },40)};
    const api={name,
      presence(patch){
        mine=Object.assign({},mine,patch);Object.keys(mine).forEach(k=>{if(mine[k]===null)delete mine[k]});
        if(isHost) broadcast(); else if(hostConn&&hostConn.open){try{hostConn.send({t:"pres",presence:mine})}catch(e){}}
        fire();return Promise.resolve();
      },
      peers:snapshot,
      onPeers(h){ph.push(h);fire();return()=>{const i=ph.indexOf(h);if(i>=0)ph.splice(i,1)}},
      connected:()=>connected,
      onConnection(h){ch.push(h);setTimeout(()=>h(connected),0);return()=>{const i=ch.indexOf(h);if(i>=0)ch.splice(i,1)}},
      leave(){closed=true;try{peer.destroy()}catch(e){}return Promise.resolve()},
      emit(){return Promise.resolve()},on(){return()=>{}}
    };
    const done=(ok,err)=>{if(settled)return;settled=true;if(ok)res(api);else{closed=true;try{peer.destroy()}catch(e){}rej(err)}};
    const connectHost=()=>{
      if(closed||peer.destroyed) return;
      const c=peer.connect(hostId,{reliable:true,serialization:"json"});
      c.on("open",()=>{hostConn=c;setConn(true);try{c.send({t:"pres",presence:mine})}catch(e){}done(true)});
      c.on("data",d=>{if(d&&d.t==="peers"&&Array.isArray(d.list)){hostList=d.list.slice(0,40);fire()}});
      c.on("close",()=>{if(hostConn===c){hostConn=null;hostList=[];setConn(false);fire();if(!closed)setTimeout(connectHost,2000)}});
      c.on("error",()=>{});
    };
    peer.on("open",id=>{selfId=id;if(isHost){setConn(true);done(true);fire()}else connectHost()});
    peer.on("connection",c=>{
      if(!isHost){try{c.close()}catch(e){}return}
      c.on("open",()=>{const v=others.get(c.peer)||{};v.conn=c;others.set(c.peer,v);broadcast()});
      c.on("data",d=>{
        if(!d||d.t!=="pres"||!d.presence||typeof d.presence!=="object") return;
        if(JSON.stringify(d.presence).length>4096) return;
        const v=others.get(c.peer)||{};v.conn=c;v.pres=d.presence;others.set(c.peer,v);broadcast();fire();
      });
      c.on("close",()=>{const v=others.get(c.peer);if(v&&v.conn===c){others.delete(c.peer);broadcast();fire()}});
    });
    peer.on("disconnected",()=>{if(!closed)setTimeout(()=>{try{if(!peer.destroyed&&peer.disconnected)peer.reconnect()}catch(e){}},1500)});
    peer.on("error",err=>{
      const t=err&&err.type;
      if(!settled){done(false,{code:t==="unavailable-id"?"taken":t==="peer-unavailable"?"no_room":"network"});return}
      if(t==="peer-unavailable"&&!isHost&&!closed) setTimeout(connectHost,3000);
    });
    setTimeout(()=>done(false,{code:"timeout"}),15000);
  })}
};

const CODE_CHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const genCode=()=>Array.from({length:5},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("");
const roomName=code=>"uca-"+code.toLowerCase();

function syncPresence(){
  const N=S.net; if(!N||!N.room) return;
  const pl=S.profiles.filter(p=>N.sel.includes(p.id)).map(p=>({id:p.id,n:p.name,e:p.emoji,c:p.color}));
  const ready=S.game&&S.deal&&S.deal.done&&S.deal.gid===S.game.gid?S.game.gid:null;
  let pres;
  if(N.isHost){
    const st=S.game?Object.assign({},S.game,{phase:S.screen==="lobby"?"deal":S.screen}):null;
    const genres=GENRES.filter(g=>ANIMES.some(a=>a.g===g.id&&S.set.animes.includes(a.id))).map(g=>g.e).join(" ");
    pres={h:1,code:N.code,pl,ready,st,info:{mode:S.set.mode,inter:interOn(),pool:pool().length,nUc:S.set.nUc,nWhite:S.set.nWhite,genres,timer:S.set.timer}};
  } else {
    pres={g:1,code:N.code,pl,ready,guess:N.guess||null};
  }
  const js=JSON.stringify(pres);
  if(js===N.last) return;
  N.last=js;
  N.room.presence(pres).catch(()=>{});
}

async function openRoom(code,isHost){
  const api=S.roomApi;
  if(!api) throw new Error("off");
  const room=S.roomKind==="p2p"?await P2P.join(roomName(code),isHost):await api.join(roomName(code));
  S.net={room,code,isHost,sel:S.netSel.slice(),me:null,peers:[],last:"",lastSt:"",hostPeer:null,hadHost:false,connected:true,guess:null};
  const N=S.net;
  N.unsubs=[
    room.onPeers(ch=>onRoomPeers(ch),()=>leaveNet("La connexion à la room a été perdue.")),
    room.onConnection(c=>{N.connected=c;if(S.net===N)renderHud()})
  ];
  syncPresence();
  return N;
}

function onRoomPeers(ch){
  const N=S.net; if(!N) return;
  N.peers=ch.peers;
  const me=ch.peers.find(p=>p.sameTab);
  if(me&&!N.me){N.me=me.peer;N.last="";syncPresence()}
  if(N.isHost){
    if(S.screen==="deal"){checkReady();if(S.deal&&S.deal.done) renderAll()}
    else if(S.screen==="guess") checkGuess();
    else if(S.screen==="lobby"&&S.tab==="play") keep(renderAll);
    return;
  }
  // Invité : on suit l’état publié par l’hôte
  const host=ch.peers.find(p=>!p.sameTab&&p.presence&&p.presence.h===1&&p.presence.code===N.code);
  if(!host){
    if(N.hadHost&&!N.lostTimer) N.lostTimer=setTimeout(()=>{
      if(S.net===N&&!N.peers.some(p=>p.presence&&p.presence.h===1)) leaveNet("L’hôte a fermé la room.");
      N.lostTimer=null;
    },9000);
    return;
  }
  N.hostPeer=host.peer;N.hadHost=true;N.info=host.presence.info||{};
  if(N.joining){N.joining=false;clearTimeout(N.joinTimer);S.busy=false;S.playView="room";N.lastSt="";}
  const st=host.presence.st&&typeof host.presence.st==="object"?host.presence.st:null;
  const key=JSON.stringify(st);
  if(key!==N.lastSt){
    N.lastSt=key;
    if(!st){S.game=null;S.screen="lobby";stopTimer();render();return}
    if(!S.game||S.game.gid!==st.gid){S.deal={gid:st.gid,idx:0,revealed:false,done:false};N.guess=null}
    const prevPhase=S.screen;
    S.game=st;
    S.screen=["deal","play","reveal","guess","end"].includes(st.phase)?st.phase:"play";
    if(S.screen==="play"&&prevPhase!=="play") {S.game.timeLeft=S.set.timer||0;S.game.running=false}
    render();
    return;
  }
  if(S.screen==="deal"&&S.deal&&S.deal.done) renderAll();
  else if(S.screen==="lobby"&&S.tab==="play") keep(renderAll);
}

function checkReady(){
  const g=S.game; if(!g||!S.net) return;
  const devs=[...new Set(g.list.map(x=>x.peer))];
  if(devs.every(isReady)){setStarter();S.screen="play";render()}
}
function isReady(peer){
  const g=S.game,N=S.net;
  if(peer===N.me) return !!(S.deal&&S.deal.done&&S.deal.gid===g.gid);
  const pr=N.peers.find(p=>p.peer===peer);
  if(!pr) return false;
  return pr.presence&&pr.presence.ready===g.gid || !g.list.some(x=>x.peer===peer);
}
function checkGuess(){
  const g=S.game,x=g.list[g.lastOut]; if(!x) return;
  const pr=S.net.peers.find(p=>p.peer===x.peer);
  const gs=pr&&pr.presence&&pr.presence.guess;
  if(gs&&gs.gid===g.gid&&gs.r===g.round&&typeof gs.t==="string") resolveGuess(gs.t);
}

function leaveNet(msg){
  const N=S.net; if(!N) return;
  S.net=null;
  (N.unsubs||[]).forEach(u=>{try{u()}catch(e){}});
  clearTimeout(N.lostTimer);clearTimeout(N.joinTimer);
  N.room.leave().catch(()=>{});
  stopTimer();S.game=null;S.screen="lobby";S.tab="play";S.playView="hub";S.flash=msg||"";
  render();
}

// Bannière en bas dans les menus, jamais pendant une partie.
// Interstitiel entre deux parties, une partie sur N, au plus une fois toutes les 3 minutes.
const Ads={ok:false,on:false,shown:false,games:0,lastInter:0,ready:false,h:0,privacy:false,
  plugin(){const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.AdMob},
  async init(){
    const A=this.plugin(),cfg=window.UI_ADS;
    if(!A||!cfg) return;
    const pf=window.Capacitor.getPlatform(), c=cfg[pf]; if(!c) return;
    this.A=A;this.c=c;this.testing=!!(cfg.testing&&cfg.testing[pf]);this.every=Math.max(1,cfg.interstitialEvery||2);
    try{
      await A.initialize({tagForChildDirectedTreatment:false,maxAdContentRating:"Teen"});
      let info=await A.requestConsentInfo();
      if(info.status==="REQUIRED"&&info.isConsentFormAvailable) info=await A.showConsentForm();
      this.privacy=info.privacyOptionsRequirementStatus==="REQUIRED";
      if(pf==="ios"){try{const t=await A.trackingAuthorizationStatus();if(t&&t.status==="notDetermined")await A.requestTrackingAuthorization()}catch(e){}}
      if(info.canRequestAds===false) return;
      A.addListener("bannerAdSizeChanged",s=>{this.h=(s&&s.height)||0;if(this.on)this.pad(this.h)});
      A.addListener("interstitialAdDismissed",()=>this.prep());
      A.addListener("interstitialAdFailedToShow",()=>this.prep());
      this.ok=true;this.prep();this.sync();
      if(S.screen==="lobby"&&S.tab==="settings") keep(renderAll);
    }catch(e){console.warn("Pubs indisponibles",e)}
  },
  pad(h){document.documentElement.style.setProperty("--ad-h",h+"px")},
  async prep(){try{await this.A.prepareInterstitial({adId:this.c.interstitial,isTesting:this.testing});this.ready=true}catch(e){this.ready=false}},
  sync(){
    if(!this.ok) return;
    const want=S.screen==="lobby"&&!S.sheetOpen;
    if(want&&!this.on){
      this.on=true;
      if(this.shown){this.A.resumeBanner().catch(()=>{});this.pad(this.h)}
      else{this.shown=true;this.A.showBanner({adId:this.c.banner,adSize:"ADAPTIVE_BANNER",position:"BOTTOM_CENTER",margin:0,isTesting:this.testing}).catch(()=>{this.shown=false;this.on=false})}
    } else if(!want&&this.on){
      this.on=false;this.pad(0);this.A.hideBanner().catch(()=>{});
    }
  },
  betweenGames(){
    if(!this.ok) return;
    this.games++;
    if(this.games%this.every!==0||!this.ready||Date.now()-this.lastInter<180000) return;
    this.lastInter=Date.now();this.ready=false;
    this.A.showInterstitial().catch(()=>this.prep());
  },
  privacyForm(){if(this.ok)this.A.showPrivacyOptionsForm().catch(()=>{})}
};

  document.getElementById("copy").onclick=()=>{try{navigator.clipboard.writeText(N.code);document.getElementById("copy").textContent="Code copié"}catch(e){}};
  app.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.rs;N.sel=N.sel.includes(id)?N.sel.filter(x=>x!==id):[...N.sel,id];S.netSel=N.sel.slice();store.set("uca2-netsel",S.netSel);buzz(10);keep(renderAll);
  });

    document.getElementById("start").onclick=startGame;
  }
}

/* ---------- Partie ---------- */
const isHostOrLocal=()=>!S.net||S.net.isHost;
const mineIdx=()=>S.game.list.map((_,i)=>i).filter(i=>!S.net||S.game.list[i].peer===S.net.me);
const P=x=>({name:x.n,emoji:x.e,color:x.c});
const cardAnime=c=>AN[c.a]||{e:"🎴",name:"Anime"};

function startGame(){
  const roster=S.net?rosterOnline():rosterLocal();
  if(problemFor(roster.length)){render();return}
  const pair=pickPair();
  const roles=shuffle([...Array(S.set.nUc).fill("uc"),...Array(S.set.nWhite).fill("white"),...Array(roster.length-S.set.nUc-S.set.nWhite).fill("civil")]);
  S.game={gid:uid(),pair,round:1,out:[],mode:S.set.mode,lastOut:null,
    list:roster.map((r,i)=>Object.assign({},r,{role:roles[i],card:roles[i]==="civil"?pair.civil:roles[i]==="uc"?pair.uc:null,alive:true}))};
  S.deal={gid:S.game.gid,idx:0,revealed:false,done:false};
  S.screen="deal";buzz(30);render();
}

function finishDeal(){
  S.deal.done=true;
  if(!S.net){setStarter();S.screen="play";render();return}
  syncPresence();
  if(S.net.isHost) checkReady();
  renderAll();
}

function renderDeal(){
  const g=S.game;
  if(!S.deal||S.deal.gid!==g.gid) S.deal={gid:g.gid,idx:0,revealed:false,done:false};
  const mine=mineIdx(), d=S.deal;
  if(!mine.length&&!d.done){d.done=true;syncPresence();if(S.net&&S.net.isHost)checkReady()}
  if(d.done) return renderWait();
  const x=g.list[mine[d.idx]], p=P(x), white=x.role==="white", total=mine.length, last=d.idx>=total-1;
  const an=white?null:cardAnime(x.card);
  const doneTxt=last?(S.net?"C’est retenu":"C’est retenu, on joue"):"C’est retenu, cacher";
  app.innerHTML=`
    <div class="dots" aria-label="Joueur ${d.idx+1} sur ${total}">${mine.map((_,i)=>`<i class="${i<d.idx?"d":i===d.idx?"c":""}"></i>`).join("")}</div>
    <div class="stage"><div class="flip ${d.revealed?"on":""}" id="flip">
      <div class="face back cut">
        ${ava(p,"lg")}
        <p class="muted" style="margin:14px 0 0;font-weight:700">${total>1?"Passe le téléphone à":"C’est ton tour"}</p>
        <div class="bigname">${esc(p.name)}</div>
      </div>
      <div class="face front cut ${white?"white":""}" aria-hidden="${!d.revealed}">
        ${white
          ?`<div class="emblem">❔</div><div class="word">Mr White</div><p class="muted" style="margin:12px 0 0;max-width:30ch">Tu n’as pas de perso. Écoute les indices et fais semblant.</p>`
          :`<div class="emblem">${an.e}</div><div class="word">${esc(x.card.n)}</div><span class="from">${esc(an.name)}</span>`}
      </div>
    </div></div>
    <button class="cta" id="act">${!d.revealed?`Je suis ${esc(p.name)}, retourner`:doneTxt}</button>`;
  document.getElementById("act").onclick=()=>{
    if(!d.revealed){d.revealed=true;buzz(25);document.getElementById("flip").classList.add("on");
      document.getElementById("act").textContent=doneTxt;return}
    d.revealed=false;
    if(!last){d.idx++;render()} else finishDeal();
  };
}

function renderWait(){
  const g=S.game, N=S.net, host=N&&N.isHost;
  const devs=[...new Set(g.list.map(x=>x.peer))];
  const inGame=g.list.some(x=>x.peer===N.me);
  app.innerHTML=`
    <div class="result cut"><div class="emblem">${inGame?"✅":"👀"}</div>
      <div class="bigname">${inGame?"Cartes vues":"Partie en cours"}</div>
      <p class="muted" style="margin:10px 0 0">${inGame?"On attend les autres téléphones.":"Tu joueras à la prochaine partie."}</p></div>
    <div class="recap">${devs.map(pe=>{const pl=g.list.filter(x=>x.peer===pe);const ok=isReadyView(pe);
      return `<div class="r"><span style="font-size:1.3rem">${ok?"✅":"⏳"}</span><span class="nm">${pl.map(x=>esc(x.n)).join(", ")}</span>${pe===N.me?`<span class="hint">ce téléphone</span>`:""}</div>`}).join("")}</div>
    ${host?`<button class="ghost" id="force">Lancer sans attendre</button>`:""}`;
  const f=document.getElementById("force");
  if(f) f.onclick=()=>{setStarter();S.screen="play";render()};
}
function isReadyView(peer){
  const g=S.game,N=S.net;
  if(peer===N.me) return !!(S.deal&&S.deal.done);
  const pr=N.peers.find(p=>p.peer===peer);
  return !!(pr&&pr.presence&&pr.presence.ready===g.gid);
}

function setStarter(){
  const g=S.game, alive=g.list.map((p,i)=>({p,i})).filter(o=>o.p.alive);
  const c=S.set.whiteNotFirst?alive.filter(o=>o.p.role!=="white"):alive;
  const from=c.length?c:alive;
  g.start=from[Math.floor(Math.random()*from.length)].i;
  g.timeLeft=S.set.timer;g.running=false;
}

function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function stopTimer(){if(S.tid){clearInterval(S.tid);S.tid=null}}
function tlen(){return S.net&&!S.net.isHost?((S.net.info&&S.net.info.timer)||0):S.set.timer}
function paintTimer(){
  const g=S.game, el=document.getElementById("timer"), T=tlen();
  if(!el||!T) return;
  el.classList.toggle("low",g.timeLeft<=10);
  el.querySelector(".clock").textContent=fmt(g.timeLeft);
  el.querySelector(".bar i").style.width=(g.timeLeft/T*100)+"%";
  el.querySelector("button").textContent=g.timeLeft===0?"Relancer":g.running?"Pause":"Démarrer";
}

function renderPlay(){
  const g=S.game, n=g.list.length, order=[], T=tlen(), can=isHostOrLocal();
  if(typeof g.timeLeft!=="number"||g.timeLeft>T) g.timeLeft=T;
  for(let k=0;k<n;k++){const i=(g.start+k)%n;if(g.list[i].alive)order.push(i)}
  app.innerHTML=`
    ${T?`<div class="timer" id="timer"><span class="clock">${fmt(g.timeLeft)}</span><span class="bar"><i style="width:${g.timeLeft/T*100}%"></i></span><button class="sbtn" style="width:auto;padding:0 14px;font-size:.9rem">Démarrer</button></div>`:""}
    <p class="muted" style="font-weight:700">${can?"Un indice chacun dans cet ordre, puis votez. Touchez le joueur éliminé.":"Un indice chacun dans cet ordre, puis votez à voix haute. L’hôte élimine le joueur choisi."}</p>
    <ol class="order">
      ${order.map((i,k)=>{const x=g.list[i],p=P(x),me=S.net&&x.peer===S.net.me;return `<li class="${k===0?"first":""}"><button data-vote="${i}" ${can?"":"disabled"}>
        <span class="n">${k+1}</span>${ava(p)}<span>${esc(p.name)}${me?` <small class="muted">(toi)</small>`:""}</span>${k===0?`<span class="tag">Commence</span>`:""}${can?`<span class="vote">Éliminer</span>`:""}</button></li>`}).join("")}
    </ol>
    ${g.out.length?`<div class="sec-h"><h2>Éliminés</h2></div><div class="out">${g.out.map(i=>{const x=g.list[i];return `<span>${ava(P(x))}${esc(x.n)} : ${roleName(x.role)}</span>`}).join("")}</div>`:""}`;
  if(T){
    paintTimer();
    document.querySelector("#timer button").onclick=()=>{
      if(g.timeLeft===0) g.timeLeft=T;
      g.running=!g.running;
      if(g.running&&!S.tid){
        S.tid=setInterval(()=>{
          g.timeLeft=Math.max(0,g.timeLeft-1);
          if(g.timeLeft===0){stopTimer();g.running=false;buzz([200,100,200])}
          paintTimer();
        },1000);
      } else if(!g.running) stopTimer();
      paintTimer();
    };
  }
  if(can) app.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.vote, p=P(g.list[i]);
    openSheet(`<div style="text-align:center">${ava(p,"lg")}<h2 style="margin-top:12px">Éliminer ${esc(p.name)} ?</h2><p class="muted" style="margin-top:6px">Son rôle sera révélé à tout le monde.</p></div>
      <div class="row2"><button class="cta alt" data-close>Annuler</button><button class="cta" id="yes">Éliminer</button></div>`,
      ()=>document.getElementById("yes").onclick=()=>{closeSheet();eliminate(i)});
  });
}

function eliminate(i){
  const g=S.game;stopTimer();
  g.list[i].alive=false;g.out.push(i);g.lastOut=i;g.whiteFailed=false;g.guessText="";buzz(60);
  S.screen=g.list[i].role==="white"?"guess":"reveal";render();
}
function checkWin(){
  const a=S.game.list.filter(p=>p.alive), imp=a.filter(p=>p.role!=="civil").length, civ=a.length-imp;
  return imp===0?"civil":civ<=1?"imp":null;
}
function nextOrEnd(win){
  if(win) endGame(win); else {S.game.round++;setStarter();S.screen="play";render()}
}
function roleCls(r){return r==="civil"?"civil":r==="uc"?"uc":"white"}
const waitHost=`<div class="waitbox">⏳ En attente de l’hôte…</div>`;

function renderReveal(){
  const g=S.game, x=g.list[g.lastOut], p=P(x), win=checkWin();
  app.innerHTML=`
    <div class="result cut">${ava(p,"lg")}
      <div class="bigname">${esc(p.name)}</div>
      <p style="margin:12px 0 0">était <span class="rolechip ${roleCls(x.role)}">${roleName(x.role)}</span></p>
    </div>
    <p class="muted" style="text-align:center;font-weight:700">${
      x.role==="white"&&g.whiteFailed?`Il a proposé « ${esc(g.guessText||"rien")} » : raté. `:""}${
      win==="civil"?"Plus aucun imposteur en jeu."
      :win==="imp"?"Il ne reste qu’un seul civil."
      :x.role==="civil"?"Raté, c’était un innocent. Les imposteurs sont toujours là."
      :"Bien vu. Mais il en reste peut-être d’autres."}</p>
    ${isHostOrLocal()?`<button class="cta" id="next">${win?"Voir les résultats":"Tour suivant"}</button>`:waitHost}`;
  const b=document.getElementById("next");
  if(b) b.onclick=()=>nextOrEnd(win);
}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\(.*?\)/g," ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function guessOk(guess,target){
  const g=norm(guess),t=norm(target);
  if(!g) return false;
  if(g===t) return true;
  const tk=t.split(" ").filter(w=>w.length>=3);
  return tk.includes(g)||g.split(" ").some(w=>w.length>=4&&tk.includes(w));
}
function resolveGuess(t){
  const g=S.game;
  if(guessOk(t,g.pair.civil.n)){buzz([60,40,60]);endGame("white",g.lastOut);return}
  g.whiteFailed=true;g.guessText=String(t).slice(0,40);S.screen="reveal";render();
}
function renderGuess(){
  const g=S.game, x=g.list[g.lastOut], p=P(x);
  const mine=!S.net||x.peer===S.net.me;
  const sent=S.net&&S.net.guess&&S.net.guess.gid===g.gid&&S.net.guess.r===g.round;
  app.innerHTML=`
    <div class="result cut">${ava(p,"lg")}<div class="bigname">${esc(p.name)}</div>
      <p style="margin:12px 0 0">était <span class="rolechip white">Mr White</span></p></div>
    ${mine&&!sent?`<p style="font-weight:700">Dernière chance, ${esc(p.name)} : quel est le perso des civils ?</p>
      <input class="field" id="g" placeholder="Nom du perso" autocomplete="off" enterkeyhint="done">
      <button class="cta" id="try">Valider</button>`
    :`<div class="waitbox">${sent?"Réponse envoyée, l’hôte vérifie…":`🤔 ${esc(p.name)} cherche le perso des civils…`}</div>`}`;
  if(!mine||sent) return;
  const go=()=>{
    const t=document.getElementById("g").value.slice(0,40);
    if(!t.trim()) return;
    if(!S.net||S.net.isHost){resolveGuess(t);return}
    S.net.guess={gid:g.gid,r:g.round,t};syncPresence();renderAll();
  };
  document.getElementById("try").onclick=go;
  document.getElementById("g").onkeydown=e=>{if(e.key==="Enter")go()};
  document.getElementById("g").focus();
}

function endGame(winner,whiteIdx){
  const g=S.game;g.winner=winner;g.gain=[];
  g.list.forEach((x,i)=>{
    let won=false,pts=0;
    if(winner==="civil"&&x.role==="civil"){won=true;pts=POINTS.civil}
    if(winner==="imp"&&x.role!=="civil"){won=true;pts=x.alive?POINTS[x.role]:0}
    if(winner==="white"&&i===whiteIdx){won=true;pts=POINTS.white}
    g.gain[i]=[won?1:0,pts];
  });
  S.screen="end";render();
}
function applyStats(){
  const g=S.game; if(!g||!Array.isArray(g.gain)||S.applied.includes(g.gid)) return;
  S.applied=[g.gid,...S.applied].slice(0,30);store.set("uca2-applied",S.applied);
  g.list.forEach((x,i)=>{
    if(S.net&&x.peer!==S.net.me) return;
    const p=prof(x.id),r=g.gain[i]; if(!p||!r) return;
    p.games++; if(r[0])p.wins++; p.pts+=r[1];
  });
  save();
}
function renderEnd(){
  const g=S.game; applyStats();
  const t=g.winner==="civil"?["🛡️","Victoire des civils"]:g.winner==="white"?["❔","Mr White a deviné !"]:["🕵️","Victoire des imposteurs"];
  const ca=cardAnime(g.pair.civil), ua=cardAnime(g.pair.uc);
  app.innerHTML=`
    <section class="banner cut"><div style="font-size:3rem;line-height:1">${t[0]}</div><h1 style="font-size:clamp(1.9rem,8.5vw,2.6rem);margin-top:8px">${t[1]}</h1>
      <div class="stats"><span class="pill">${MODES[g.mode]||""}</span>${g.pair.cross?`<span class="pill">🔀 Inter-anime</span>`:""}</div></section>
    <div class="words">
      <div><span class="e">${ca.e}</span><small class="muted" style="display:block;font-weight:700">Civils</small><b>${esc(g.pair.civil.n)}</b></div>
      <div><span class="e">${ua.e}</span><small class="muted" style="display:block;font-weight:700">Undercover</small><b>${esc(g.pair.uc.n)}</b></div>
    </div>
    <div class="recap">${g.list.map((x,i)=>{const r=(g.gain||[])[i]||[0,0];return `<div class="r">${ava(P(x))}<span class="nm">${esc(x.n)}</span>
      <span class="rolechip ${roleCls(x.role)}" style="font-size:.8rem">${roleName(x.role)}</span>${r[1]?`<span class="plus">+${r[1]}</span>`:""}</div>`}).join("")}</div>
    ${isHostOrLocal()?`<button class="cta" id="again">Rejouer</button>
      <button class="cta alt" id="lobby">${S.net?"Retour à la room":"Retour au menu"}</button>`:waitHost}`;
  if(!isHostOrLocal()) return;
  document.getElementById("again").onclick=startGame;
  document.getElementById("lobby").onclick=()=>{S.game=null;S.screen="lobby";S.tab="play";render()};
}

/* ---------- Rendu ---------- */
const app=document.getElementById("app");
let prevScreen="lobby";
function renderAll(){
  if(S.screen!=="play") stopTimer();
  if(prevScreen==="end"&&S.screen!=="end") Ads.betweenGames();
  prevScreen=S.screen;
  app.classList.toggle("ingame",S.screen!=="lobby");
  renderHud();renderTabs();
  if(S.screen==="lobby") ({play:renderPlayTab,profiles:renderProfiles,settings:renderSettings})[S.tab]();
  else ({deal:renderDeal,play:renderPlay,reveal:renderReveal,guess:renderGuess,end:renderEnd})[S.screen]();
  syncPresence();
  Ads.sync();
}
function keep(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function render(){renderAll();window.scrollTo(0,0)}
applyTheme();render();
Ads.init();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")&&!window.claude&&!window.Capacitor){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
// Les rooms s’allument quand le service répond
(async()=>{
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      const r=await window.claude.use("room");
      S.roomApi=r||null;S.roomKind="claude";
    } else if(typeof Peer==="function"){
      S.roomApi=P2P;S.roomKind="p2p";
    }
  }catch(e){S.roomApi=null}
  S.roomState=S.roomApi?"ok":"off";
  if(S.screen==="lobby"&&S.tab==="play"&&!S.net) keep(renderAll);
})();
</script>
